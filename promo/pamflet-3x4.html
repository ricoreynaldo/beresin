<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pamflet Beresin 3:4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Pamflet 3:4 Beresin — putih, minimalis, seleksi teks biru sebagai motif.
     Disetel untuk cetak: warna solid (tanpa transparansi), tinta gelap, huruf tidak terlalu rapat
     supaya tidak menyatu kalau tinta melebar. */
  @page { size: 210mm 280mm; margin: 0; }

  :root {
    --paper: #ffffff;
    --ink: #2b1f1a;
    --ink-soft: #3f322c;
    --ink-mute: #5c4d46;
    --line: #cfc9c4;
    --blue: #2438d6;
    --sel: #c7cbf6;
    --sel-ink: #2c2560;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--paper); }
  @media screen and (min-width: 820px) { html, body { background: #d9d7d3; } }

  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    position: relative;
    width: 210mm;
    height: 280mm;
    margin: 0 auto;
    overflow: hidden;
    background: var(--paper);
    padding: 17mm 18mm 18mm;
    display: flex;
    flex-direction: column;
  }

  @media screen and (min-width: 820px) { .sheet { margin: 24px auto; box-shadow: 0 20px 60px rgba(0,0,0,.18); } }
  @media print { html, body { background: var(--paper); } }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: center; }

  .logo {
    display: inline-flex;
    align-items: center;
    font-size: 8.4mm;
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: .9;
  }
  .logo::after {
    content: "";
    width: .8mm;
    height: 7.6mm;
    margin-left: 1.4mm;
    background: var(--ink);
  }

  .tag { font-size: 3.6mm; color: var(--ink-soft); }

  /* Headline */
  .hero { margin-top: 32mm; }

  .kicker {
    font-size: 9mm;
    font-weight: 500;
    letter-spacing: -.02em;
    color: var(--ink-mute);
  }

  .headline {
    margin-top: 6mm;
    font-size: 26mm;
    line-height: .98;
    font-weight: 600;
    letter-spacing: -.04em;
  }
  .headline .row { display: block; }
  .headline .row + .row { margin-top: 6mm; }

  .sel {
    position: relative;
    display: inline-block;
    margin-top: 1.2mm;
    padding: .6mm 5mm 3.4mm 3mm;
    background: var(--sel);
    color: var(--sel-ink);
    font-style: italic;
    border-left: .7mm solid var(--blue);
    border-right: .7mm solid var(--blue);
  }
  .sel::before,
  .sel::after {
    content: "";
    position: absolute;
    width: 6.4mm;
    height: 6.4mm;
    border-radius: 50%;
    background: var(--blue);
  }
  /* gagang seleksi: kiri-atas & kanan-bawah */
  .sel::before { left: -3.6mm; top: -5.6mm; }
  .sel::after { right: -3.6mm; bottom: -5.6mm; }

  .sub {
    margin-top: 18mm;
    font-size: 6.6mm;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -.01em;
    color: var(--ink-soft);
  }

  /* Bagian bawah */
  .lower {
    margin-top: auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10mm;
    padding-top: 10mm;
    border-top: .35mm solid var(--line);
  }

  .flow {
    display: flex;
    align-items: center;
    gap: 3.6mm;
    font-size: 5.8mm;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .flow svg { width: 6mm; height: 3mm; color: var(--ink-mute); }
  .flow em { font-weight: 600; color: var(--sel-ink); }

  .scan-label { margin-top: 11mm; font-size: 3.6mm; color: var(--ink-soft); }
  .link { margin-top: 2.4mm; font-size: 7.6mm; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .note { margin-top: 2.6mm; font-size: 4.4mm; font-weight: 500; color: var(--ink-soft); }

  .qr { width: 44mm; height: 44mm; display: block; flex: none; image-rendering: pixelated; }
</style>
</head>
<body>
  <main class="sheet">
    <header class="top">
      <span class="logo">BERESIN</span>
      <span class="tag mono">Request tanpa akun</span>
    </header>

    <section class="hero">
      <p class="kicker">Kerjaan numpuk?</p>
      <h1 class="headline">
        <span class="row">Kamu cerita.</span>
        <span class="row">Kami <span class="sel">beresin.</span></span>
      </h1>

      <p class="sub">Desain, website, konten, data, hingga urusan administrasi.</p>
    </section>

    <section class="lower">
      <div>
        <p class="flow">
          Isi form
          <svg viewBox="0 0 20 10" aria-hidden="true"><path d="M0 5h18M14 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          Nego di WhatsApp
          <svg viewBox="0 0 20 10" aria-hidden="true"><path d="M0 5h18M14 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <em>Beres.</em>
        </p>
        <p class="scan-label mono">Scan untuk request</p>
        <p class="link">beresin-agent.vercel.app</p>
        <p class="note">atau buka link di caption</p>
      </div>
      <img class="qr" src="qr-request.svg" alt="QR code ke halaman request Beresin">
    </section>
  </main>
</body>
</html>
